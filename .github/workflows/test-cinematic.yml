name: TEST - Cinematic backgrounds (exploration only)

# Creative exploration (2026-10-09): real-footage backgrounds from Coverr under the unchanged production text layer.
# Lives on the test/cinematic branch only. Touches nothing in production: no n8n callback, no Instagram, no state
# files; output goes to the Cloudinary folder cinematic-test/.
on:
  push:
    branches: [test/cinematic]
    paths: ['.github/workflows/test-cinematic.yml', 'scripts/test_cinematic_*.js', 'test/cinematic.json']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Locate Chrome
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then echo "path=$(command -v $bin)" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No Chrome/Chromium binary found" >&2; exit 1

      - name: Scout or render (test/cinematic.json decides)
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: |
          mode=$(node -e "console.log(require('./test/cinematic.json').mode)")
          echo "mode: $mode"
          if [ "$mode" = scout ]; then
            node scripts/test_cinematic_scout.js out/scout "$(node -e "console.log((require('./test/cinematic.json').queries||[]).join(','))")"
          elif [ "$mode" = import ]; then
            node scripts/test_cinematic_import.js out/import
          else
            node scripts/test_cinematic_render.js out/render
          fi
