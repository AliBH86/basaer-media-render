name: Studio clip - prepare (download, voice, words)

# Owner, 2026-10-12: the owner sends the Studio bot a link (standing permission for every link the owner shares).
# This job downloads the clip's audio, keeps the original, separates the voice (Demucs, so a voice-only version is
# always available), transcribes the voice with word times, and posts everything back to n8n (resumeUrl).
# Nothing is rendered or published here.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link the owner shared"
        required: true
      itemId:
        description: "Studio item id (C-...)"
        required: true
      resumeUrl:
        description: "n8n resumeUrl (optional: empty = no callback)"
        required: false
        default: ""

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_SEC: "180"
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install yt-dlp
        run: pip install --quiet -U "yt-dlp[default]"
      - name: Download the clip's audio
        id: dl
        env:
          CLIP_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p work
          # Instagram sometimes refuses anonymous downloads for a while (2026-10-14: "exceeded the rate-limit"); a retry later works
          for n in 1 2 3 4 5; do
            yt-dlp --no-playlist -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 --write-info-json -o "work/clip.%(ext)s" "$CLIP_URL" 2>&1 | tail -20
            test -s work/clip.mp3 && break
            echo "download attempt $n failed, waiting $((n * 45)) s"
            [ "$n" -lt 5 ] && sleep $((n * 45))
          done
          ls -la work
          test -s work/clip.mp3
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/clip.mp3)
          echo "duration=$D" >> "$GITHUB_OUTPUT"
          awk -v d="$D" -v m="$MAX_SEC" 'BEGIN { exit (d > m) ? 1 : 0 }' || { echo "clip is ${D}s, longer than ${MAX_SEC}s" > work/error.txt; exit 1; }
      - name: Install Demucs + faster-whisper (CPU)
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs faster-whisper soundfile
      - name: Separate the voice
        run: |
          ffmpeg -nostdin -loglevel error -y -i work/clip.mp3 -ac 2 -ar 44100 work/clip.wav
          python -m demucs --two-stems=vocals -n htdemucs_ft -o work/sep work/clip.wav
          ffmpeg -nostdin -loglevel error -y -i work/sep/htdemucs_ft/clip/vocals.wav -af "highpass=f=70,loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -ac 1 -b:a 160k work/voice.mp3
          ffmpeg -nostdin -loglevel error -y -i work/clip.mp3 -af "loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -b:a 192k work/original.mp3
          for f in vocals no_vocals; do echo "$f:"; ffmpeg -nostdin -i work/sep/htdemucs_ft/clip/$f.wav -af volumedetect -f null - 2>&1 | grep -E "mean_volume"; done | tee work/levels.txt
      - name: Transcribe the voice (word times)
        env:
          STUDIO_VAD: "0"
        run: |
          export STUDIO_HINT="$(node -e "const j=require('./work/clip.info.json');console.log(String(j.description||j.title||'').slice(0,400))" 2>/dev/null || true)"
          python scripts/studio_transcribe.py work/voice.mp3 large-v3 work/words.json
      - name: Upload audio
        run: |
          node scripts/upload_cloudinary.js work/original.mp3 "studio/clips/${{ github.event.inputs.itemId }}-original-${{ github.run_id }}" video work originalUrl
          node scripts/upload_cloudinary.js work/voice.mp3 "studio/clips/${{ github.event.inputs.itemId }}-voice-${{ github.run_id }}" video work voiceUrl
          cat work/uploads.json
      - name: Report to n8n
        if: ${{ always() && github.event.inputs.resumeUrl != '' }}
        env:
          RESUME_URL: ${{ github.event.inputs.resumeUrl }}
          JOB_OK: ${{ job.status == 'success' }}
        run: |
          node -e "
          const fs=require('fs');const rd=(f,d)=>{try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){return d}};
          const info=rd('work/clip.info.json',{}),up=rd('work/uploads.json',{}),w=rd('work/words.json',{});
          let err='';try{err=fs.readFileSync('work/error.txt','utf8').trim()}catch(e){}
          let levels='';try{levels=fs.readFileSync('work/levels.txt','utf8')}catch(e){}
          const ok=process.env.JOB_OK==='true'&&!!up.voiceUrl;
          const out={ok,error:ok?'':(err||'download or processing failed (see run ${{ github.run_id }})'),runId:'${{ github.run_id }}',
            title:info.title||'',uploader:info.uploader||info.channel||'',channel:info.channel||info.uploader_id||'',description:String(info.description||'').slice(0,1500),
            webpage:info.webpage_url||'',durationSec:w.duration||info.duration||0,originalUrl:up.originalUrl||'',voiceUrl:up.voiceUrl||'',levels,
            segments:w.segments||[],words:w.words||[]};
          fs.writeFileSync('work/cb.json',JSON.stringify(out));"
          curl -sS -X POST "$RESUME_URL" -H "Content-Type: application/json" --data-binary @work/cb.json
