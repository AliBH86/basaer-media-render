name: Test Reel 94:6 + bokeh readability check

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Background style for the test Reel"
        default: "stars"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Render 94:6 test Reel
        run: |
          chmod +x scripts/generate_background.sh scripts/render_test_94_6.sh
          mkdir -p out
          ./scripts/render_test_94_6.sh "${{ github.event.inputs.style || 'stars' }}" "out/test_94_6.mp4"

      - name: Extract 3 still frames (start, mid word, end)
        run: |
          ffmpeg -y -ss 0.2 -i out/test_94_6.mp4 -frames:v 1 out/frame_start.png
          ffmpeg -y -ss 2.0 -i out/test_94_6.mp4 -frames:v 1 out/frame_mid_gold.png
          ffmpeg -y -ss 4.0 -i out/test_94_6.mp4 -frames:v 1 out/frame_end.png
          ls -la out/

      - name: Upload test Reel + frames to Cloudinary
        run: |
          upload() {
            local file="$1" pubid="$2" type="$3"
            curl -sS -X POST "https://api.cloudinary.com/v1_1/b72gfdzx/${type}/upload" \
              -F "file=@${file}" -F "upload_preset=ml_default" -F "public_id=${pubid}" -o "resp_${pubid//\//_}.json"
            node -e "const r=require('./resp_${pubid//\//_}.json'); console.log('${pubid} ->', r.secure_url || JSON.stringify(r.error));"
          }
          upload "out/test_94_6.mp4" "reel-test/test_94_6-${{ github.run_id }}" "video"
          upload "out/frame_start.png" "reel-test/frame_start-${{ github.run_id }}" "image"
          upload "out/frame_mid_gold.png" "reel-test/frame_mid_gold-${{ github.run_id }}" "image"
          upload "out/frame_end.png" "reel-test/frame_end-${{ github.run_id }}" "image"

      - name: Bokeh readability check (still frame with text over bokeh background)
        run: |
          ./scripts/generate_background.sh bokeh 1 out/bokeh_still_bg.mp4
          ffmpeg -y -i out/bokeh_still_bg.mp4 -i assets/test_94_6/word_2.png \
            -filter_complex "[0:v][1:v]overlay" -frames:v 1 out/bokeh_readability.png
          curl -sS -X POST "https://api.cloudinary.com/v1_1/b72gfdzx/image/upload" \
            -F "file=@out/bokeh_readability.png" -F "upload_preset=ml_default" -F "public_id=reel-test/bokeh_readability-${{ github.run_id }}" \
            -o resp_bokeh.json
          node -e "const r=require('./resp_bokeh.json'); console.log('bokeh_readability ->', r.secure_url || JSON.stringify(r.error));"

      - name: Spec check (resolution, codec, duration, size)
        run: |
          echo "--- ffprobe ---"
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=width,height,codec_name,avg_frame_rate,pix_fmt -of default=noprint_wrappers=1 out/test_94_6.mp4
          echo "--- file size ---"
          stat -c '%s bytes' out/test_94_6.mp4

      - name: Upload artifacts (backup, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: test-94-6-outputs
          path: out/
          retention-days: 7
