name: Test Reel (general, multi-ayah)

on:
  workflow_dispatch:
    inputs:
      surah:
        description: "Surah number"
        required: true
      ayahStart:
        description: "Starting ayah number"
        required: true
      reciterId:
        description: "Reciter ID"
        default: "7"
        required: false
      style:
        description: "Background style"
        default: "stars"
        required: false
      ayahEnd:
        description: "Last ayah of the passage (optional). When given, exactly ayahStart..ayahEnd is rendered (40 s soft cap, 45 s hard cap). When empty the passage auto-extends to ~15 s."
        required: false
      resumeUrl:
        description: "n8n resumeUrl to POST results back to (optional - omitted on manual/standalone runs)"
        required: false
      translationId:
        description: "Quran.com translation resource id (one config value in n8n: Config.TRANSLATION_ID). 20 = Saheeh International."
        default: "20"
        required: false
      translationName:
        description: "Translation name for the credit line (n8n Config.TRANSLATION_NAME)."
        default: "Saheeh International"
        required: false
      cloudFolder:
        description: "Cloudinary folder for the Reel and stills (default reel-test; overnight QA uses qa-overnight)"
        default: "reel-test"
        required: false
      integrityTest:
        description: "TEST ONLY: any value deliberately corrupts one diacritic, to prove the text-integrity guard blocks the render. Leave empty."
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Public repo (2026-10-21): the n8n return link and the YouTube upload link are read from the event file (never written
      # into a printed command) and masked, so they never appear in the public run log.
      - name: Mask private links
        run: |
          for k in resumeUrl uploadUrl; do
            v=$(jq -r ".inputs.$k // empty" "$GITHUB_EVENT_PATH")
            if [ -n "$v" ]; then
              echo "::add-mask::$v"
              if [ "$k" = resumeUrl ]; then echo "RESUME_URL=$v" >> "$GITHUB_ENV"; else echo "UPLOAD_URL=$v" >> "$GITHUB_ENV"; fi
            fi
          done

      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Locate Chrome
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "path=$(command -v $bin)" >> "$GITHUB_OUTPUT"
              echo "Found: $bin at $(command -v $bin)"
              exit 0
            fi
          done
          echo "No Chrome/Chromium binary found" >&2
          exit 1

      - name: Integrity guard self-test (offline)
        run: node scripts/verify_text.js --selftest

      - name: Render Reel
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          INTEGRITY_TEST_TAMPER: ${{ github.event.inputs.integrityTest }}
          TRANSLATION_ID: ${{ github.event.inputs.translationId || '20' }}
          TRANSLATION_NAME: ${{ github.event.inputs.translationName || 'Saheeh International' }}
        run: |
          mkdir -p out
          node scripts/render_reel.js "${{ github.event.inputs.surah }}" "${{ github.event.inputs.ayahStart }}" "${{ github.event.inputs.reciterId || '7' }}" "${{ github.event.inputs.style || 'stars' }}" out "${{ github.event.inputs.ayahEnd }}"

      - name: Extract the 4 review stills (start, two middles, end - each with a gold word)
        run: |
          REEL_FILE=$(ls out/reel_*.mp4)
          node scripts/pick_review_stills.js out | while read -r name seconds; do
            ffmpeg -y -nostdin -ss "$seconds" -i "$REEL_FILE" -frames:v 1 "out/${name}.png"
          done
          ls -la out/

      - name: Upload Reel + stills to Cloudinary
        run: |
          REEL_FILE=$(ls out/reel_*.mp4)
          node scripts/upload_cloudinary.js "$REEL_FILE" "${{ github.event.inputs.cloudFolder || 'reel-test' }}/reel-${{ github.run_id }}" video out reelUrl
          for f in out/frame_start.png out/frame_mid1.png out/frame_mid2.png out/frame_end.png; do
            name=$(basename "$f" .png)
            part=${name#frame_}
            node scripts/upload_cloudinary.js "$f" "${{ github.event.inputs.cloudFolder || 'reel-test' }}/${name}-${{ github.run_id }}" image out "frame${part^}Url"
          done
          # 2x2 review tile of the four stills (start, middle 1 / middle 2, end), for a quick visual check
          ffmpeg -y -nostdin -i out/frame_start.png -i out/frame_mid1.png -i out/frame_mid2.png -i out/frame_end.png -filter_complex "[0:v][1:v]hstack=2[t];[2:v][3:v]hstack=2[b];[t][b]vstack=2,scale=1080:-2" out/stills_tile.jpg
          node scripts/upload_cloudinary.js out/stills_tile.jpg "${{ github.event.inputs.cloudFolder || 'reel-test' }}/stills-tile-${{ github.run_id }}" image out stillsTileUrl

      - name: Spec check
        run: |
          REEL_FILE=$(ls out/reel_*.mp4)
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name,avg_frame_rate -of default=noprint_wrappers=1 "$REEL_FILE"
          stat -c '%s bytes' "$REEL_FILE"
          cat out/render_stats.json
          echo "--- caption.txt ---"
          cat out/caption.txt
          echo "--- uploads.json ---"
          cat out/uploads.json

      - name: Upload artifacts (backup, 7-day retention)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-general-outputs
          path: out/
          retention-days: 7

      - name: Notify n8n (resumeUrl callback, only if provided)
        if: ${{ github.event.inputs.resumeUrl != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const uploads = JSON.parse(fs.readFileSync('out/uploads.json', 'utf8'));
            const stats = JSON.parse(fs.readFileSync('out/render_stats.json', 'utf8'));
            const caption = fs.readFileSync('out/caption.txt', 'utf8');
            fs.writeFileSync('out/callback_payload.json', JSON.stringify({ ...uploads, stats, caption, runId: '${{ github.run_id }}' }));
          "
          curl -sS -X POST "$RESUME_URL" \
            -H "Content-Type: application/json" \
            -d @out/callback_payload.json

      - name: Notify n8n of a FAILED render (resumeUrl callback, only if provided)
        if: ${{ failure() && github.event.inputs.resumeUrl != '' }}
        run: |
          node scripts/notify_failure.js out "${{ github.run_id }}" "${{ github.event.inputs.surah }}" "${{ github.event.inputs.ayahStart }}"
          curl -sS -X POST "$RESUME_URL" \
            -H "Content-Type: application/json" \
            -d @out/failure_payload.json
