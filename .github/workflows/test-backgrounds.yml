name: Test background styles

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Sample duration in seconds"
        default: "15"
        required: false
      styles:
        description: "Comma-separated styles to render"
        default: "gradient,stars,rays,mist,lattice,bokeh"
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      styles: ${{ steps.parse.outputs.styles }}
    steps:
      - id: parse
        run: |
          raw="${{ github.event.inputs.styles || 'gradient,stars,rays,mist,lattice,bokeh' }}"
          json=$(node -e "console.log(JSON.stringify('$raw'.split(',').map(s=>s.trim())))")
          echo "styles=$json" >> "$GITHUB_OUTPUT"

  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        style: ${{ fromJSON(needs.setup.outputs.styles) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Render ${{ matrix.style }} sample
        run: |
          chmod +x scripts/generate_background.sh
          mkdir -p out
          time ./scripts/generate_background.sh "${{ matrix.style }}" "${{ github.event.inputs.duration || '15' }}" "out/${{ matrix.style }}.mp4"
          ls -la "out/${{ matrix.style }}.mp4"

      - name: Upload ${{ matrix.style }} to R2
        env:
          R2_BASAER_ENDPOINT: ${{ secrets.R2_BASAER_ENDPOINT }}
          R2_BASAER_ACCESS_KEY_ID: ${{ secrets.R2_BASAER_ACCESS_KEY_ID }}
          R2_BASAER_SECRET_ACCESS_KEY: ${{ secrets.R2_BASAER_SECRET_ACCESS_KEY }}
          R2_BASAER_PUBLIC_BASE: https://basaer-media.ahbrandsbh.com
        run: node scripts/upload_r2.js "out/${{ matrix.style }}.mp4" "basaer/temp/reel-bg-test/${{ matrix.style }}-${{ github.run_id }}.mp4" video/mp4

      - name: Upload artifact (backup copy, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: bg-${{ matrix.style }}
          path: out/${{ matrix.style }}.mp4
          retention-days: 7
