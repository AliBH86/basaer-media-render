name: Studio - voice only + words (research only)

# Owner, 2026-10-12: a permitted clip (link the owner shares) becomes a Basaer video. Many clips carry a music bed;
# #دعاء and #حديث allow nature sound or silence only, so the voice is separated from the music first (Demucs), then
# the voice is transcribed with word times (faster-whisper) so the on-screen words follow the speaker.
# Nothing is rendered or published: the voice track and the words come back as an artifact for review.
on:
  workflow_dispatch:
    inputs:
      audioUrl:
        description: "Clip audio (Cloudinary URL)"
        required: true
      whisperModel:
        description: "faster-whisper model"
        default: "large-v3"
      hint:
        description: "Words that help the model (clip caption, names)"
        default: ""
      vad:
        description: "1 = skip quiet parts, 0 = keep every second"
        default: "0"

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Demucs + faster-whisper (CPU)
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs faster-whisper soundfile
      - name: Get the clip
        run: |
          mkdir -p work
          curl -sSL --fail -o work/clip.mp3 "${{ github.event.inputs.audioUrl }}"
          ffmpeg -nostdin -loglevel error -y -i work/clip.mp3 -ac 2 -ar 44100 work/clip.wav
      - name: Separate the voice from the music
        run: |
          python -m demucs --two-stems=vocals -n htdemucs_ft -o work/sep work/clip.wav
          cp work/sep/htdemucs_ft/clip/vocals.wav work/vocals.wav
          cp work/sep/htdemucs_ft/clip/no_vocals.wav work/bed.wav
          for f in vocals bed; do echo "$f:"; ffmpeg -nostdin -i work/$f.wav -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"; done
      - name: Transcribe the voice (word times)
        env:
          STUDIO_HINT: ${{ github.event.inputs.hint }}
          STUDIO_VAD: ${{ github.event.inputs.vad }}
        run: python scripts/studio_transcribe.py work/vocals.wav "${{ github.event.inputs.whisperModel }}" work/words.json
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            work/vocals.wav
            work/bed.wav
            work/words.json
          retention-days: 14
