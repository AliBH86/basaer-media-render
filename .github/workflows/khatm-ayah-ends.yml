name: Khatm research (ayah-end pauses, no rendering)

# Measures how quiet each assigned reciter's recording gets at every ayah end (numbers only), so the plan can end
# Reels where the reciter really pauses. Split into ranges that run in parallel. Nothing is published or uploaded.
on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        range: ["1 2", "3 4", "5 7", "8 12", "13 20", "21 30", "31 45", "46 70", "71 114"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Measure ayah-end pauses
        run: node scripts/khatm_ayah_end_pauses.js ${{ matrix.range }}
      - uses: actions/upload-artifact@v4
        with:
          name: ayah-end-pauses-${{ strategy.job-index }}
          path: out/*.json
          retention-days: 7
