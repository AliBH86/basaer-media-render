name: YouTube Live - encode surahs (one-time build)

# Builds YouTube-ready surah files for the Basaer Live stream (scripts/live_encode.sh). Encoding happens ONLY here (free
# GitHub runners on this public repo), never on the streaming server. Output: an Actions artifact kept for 2 days
# (surah files, manifest.tsv, one still per surah for an eye check). Nothing is uploaded to R2 or YouTube.
on:
  workflow_dispatch:
    inputs:
      surahs:
        description: 'Surahs, e.g. "1,112-114" (keep a batch under about 8 GB: ~10 hours of audio)'
        required: true

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && ffmpeg -version | head -1
      - name: Locate Chrome
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then echo "path=$(command -v $bin)" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No Chrome found" >&2; exit 1
      - name: Encode
        env:
          R2_BASAER_ENDPOINT: ${{ secrets.R2_BASAER_ENDPOINT }}
          R2_BASAER_ACCESS_KEY_ID: ${{ secrets.R2_BASAER_ACCESS_KEY_ID }}
          R2_BASAER_SECRET_ACCESS_KEY: ${{ secrets.R2_BASAER_SECRET_ACCESS_KEY }}
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
          SURAHS: ${{ github.event.inputs.surahs }}
        run: |
          [[ "$SURAHS" =~ ^[0-9,-]+$ ]] || { echo "bad surah list"; exit 1; }
          scripts/live_encode.sh out/live "$SURAHS"
          cat out/live/manifest.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: live-surahs
          path: out/live
          retention-days: 2
          compression-level: 0
