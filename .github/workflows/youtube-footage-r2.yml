name: YouTube footage to R2

# Rebuilds the graded 16:9 shots for full-surah videos on R2. Review only: nothing publishes. Safe to repeat: shots already on R2 are skipped.
on:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Grade and upload shots
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          R2_BASAER_ENDPOINT: ${{ secrets.R2_BASAER_ENDPOINT }}
          R2_BASAER_ACCESS_KEY_ID: ${{ secrets.R2_BASAER_ACCESS_KEY_ID }}
          R2_BASAER_SECRET_ACCESS_KEY: ${{ secrets.R2_BASAER_SECRET_ACCESS_KEY }}
          R2_BASAER_PUBLIC_BASE: https://basaer-media.ahbrandsbh.com
        run: node scripts/yt_grade_footage.js out ${{ matrix.shard }} 4
