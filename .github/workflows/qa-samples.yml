name: SAMPLE - prayer-time cards (research only)

on:
  workflow_dispatch:
    inputs:
      startDate:
        description: "First day (dd-mm-yyyy)"
        default: "04-10-2026"
        required: false

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate Chrome
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then echo "path=$(command -v $bin)" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          exit 1
      - name: Install puppeteer-core
        run: npm install --no-save --no-audit --no-fund puppeteer-core@23
      - name: Render SAMPLE cards (nothing is published)
        env:
          R2_BASAER_ENDPOINT: ${{ secrets.R2_BASAER_ENDPOINT }}
          R2_BASAER_ACCESS_KEY_ID: ${{ secrets.R2_BASAER_ACCESS_KEY_ID }}
          R2_BASAER_SECRET_ACCESS_KEY: ${{ secrets.R2_BASAER_SECRET_ACCESS_KEY }}
          R2_BASAER_PUBLIC_BASE: https://basaer-media.ahbrandsbh.com
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/sample_prayer_cards.js out/samples "${{ github.event.inputs.startDate || '04-10-2026' }}"
