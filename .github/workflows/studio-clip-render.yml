name: Studio clip - render (time the final text, render the Reel)

# Owner, 2026-10-12: second step of a Studio link. n8n sends the final on-screen text (Claude's corrected transcript or
# the owner's own wording) as spec JSON. The text is timed on the voice-only track by forced alignment (so any wording
# the owner types is timed correctly), then rendered with scripts/render_series.js over approved library footage, with
# the audio the owner chose (original or voice only). Result goes back to n8n (resumeUrl). Nothing is published here.
# A typed poem (spec.poem, owner 2026-10-14): voiceUrl is the raw ElevenLabs voice; scripts/poem_audio.js builds the
# lead-in voice (for timing) and the heard track (voice + music E1 32 dB under it, or voice only when spec.music is false).
on:
  workflow_dispatch:
    inputs:
      itemId:
        description: "Studio item id (C-...)"
        required: true
      spec:
        description: "JSON: lines[], pageStarts[], arc, maxShot, title, titleEn, reciter, reciterEn, sub, cta[]"
        required: true
      audioUrl:
        description: "Audio heard in the Reel (original or voice only)"
        required: true
      voiceUrl:
        description: "Voice-only track (used for timing)"
        required: true
      resumeUrl:
        description: "n8n resumeUrl (optional)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Locate Chrome
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then echo "path=$(command -v $bin)" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "No Chrome found" >&2; exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install the aligner (CPU)
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git
      - name: Write the item folder
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: node scripts/studio_clip_files.js "$SPEC" work/item
      - name: Time the text on the voice
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          if [ "$(node -e 'process.stdout.write(String(!!JSON.parse(process.env.SPEC).poem))')" = true ]; then
            curl -sSL --fail -o work/voice_raw.mp3 "${{ github.event.inputs.voiceUrl }}"
            node scripts/poem_audio.js work/voice_raw.mp3 work "$(node -e 'process.stdout.write(JSON.parse(process.env.SPEC).music === false ? "0" : "1")')"
            echo "AUDIO_URL=file://$PWD/work/audio.mp3" >> "$GITHUB_ENV"
          else
            curl -sSL --fail -o work/voice.mp3 "${{ github.event.inputs.voiceUrl }}"
            echo "AUDIO_URL=${{ github.event.inputs.audioUrl }}" >> "$GITHUB_ENV"
          fi
          ffmpeg -nostdin -loglevel error -y -i work/voice.mp3 -ac 1 -ar 16000 work/voice.wav
          python scripts/series_align.py work/voice.wav work/item/phrases.json work/item/aligned.json
      - name: Render
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.path }}
        run: node scripts/render_series.js work/item 1 out
      - name: Stills + upload
        run: |
          REEL=$(ls out/series_part_*.mp4)
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$REEL")
          ffmpeg -nostdin -loglevel error -y -ss $(echo "$D*0.4" | bc -l) -i "$REEL" -frames:v 1 -vf scale=540:-2 out/cover.jpg
          node scripts/upload_cloudinary.js "$REEL" "studio/clips/${{ github.event.inputs.itemId }}-reel-${{ github.run_id }}" video out reelUrl
          node scripts/upload_cloudinary.js out/cover.jpg "studio/clips/${{ github.event.inputs.itemId }}-cover-${{ github.run_id }}" image out coverUrl
          cat out/uploads.json
      - name: Report to n8n
        if: ${{ always() && github.event.inputs.resumeUrl != '' }}
        env:
          RESUME_URL: ${{ github.event.inputs.resumeUrl }}
          JOB_OK: ${{ job.status == 'success' }}
        run: |
          mkdir -p out
          node -e "
          const fs=require('fs');const rd=(f,d)=>{try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch(e){return d}};
          const up=rd('out/uploads.json',{}),st=rd('out/render_stats.json',{}),al=rd('work/item/aligned.json',{words:[]});
          const weak=(al.words||[]).filter(w=>w.score<-1.5).map(w=>w.w).slice(0,12);
          const ok=process.env.JOB_OK==='true'&&!!up.reelUrl;
          fs.writeFileSync('out/cb.json',JSON.stringify({ok,error:ok?'':'render failed (see run ${{ github.run_id }})',runId:'${{ github.run_id }}',reelUrl:up.reelUrl||'',coverUrl:up.coverUrl||'',stats:st,weakWords:weak}));"
          curl -sS -X POST "$RESUME_URL" -H "Content-Type: application/json" --data-binary @out/cb.json
